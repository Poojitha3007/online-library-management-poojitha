apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-demo-poojitha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-demo-poojitha
  template:
    metadata:
      labels:
        app: library-demo-poojitha
    spec:
      containers:
      - name: library-demo-poojitha
        image: kurellapoojitha/online-library-management-poojitha:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: library-demo-service-poojitha
spec:
  type: NodePort
  selector:
    app: library-demo-poojitha
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30013
